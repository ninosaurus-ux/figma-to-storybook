name: Build & deploy Storybook

# Jalan setiap ada push ke token, komponen, story, atau config — di branch main.
on:
  push:
    branches: [main]
    paths:
      - 'tokens.json'
      - 'src/**'
      - '.storybook/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/**'

permissions:
  contents: write # untuk commit balik folder dist/
  pages: write # untuk deploy ke GitHub Pages
  id-token: write # dibutuhkan oleh actions/deploy-pages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 #full history, biar git pull --rebase aman

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build tokens (style-dictionary + preview page)
        run: npm run build

      - name: Commit hasil build (dist/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --staged --quiet; then
           echo "dist/ tidak berubah - skip commit"
          else
            git commit -m "chore: rebuild design tokens [skip ci]"
            git pull --rebase origin main # tarik commit terbaru dulu biar push gak ditolak
            git push
          fi

      - name: Build Storybook statis
        run: npm run build-storybook

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
